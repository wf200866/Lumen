plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lumen.image'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumen.image"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file("../keystore.jks")
            storePassword "lumen2026"
            keyAlias "lumen"
            keyPassword "lumen2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 必须解压 .so 到 nativeLibraryDir，才能当可执行文件启动
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/*.kotlin_module', '*.safetensors']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}