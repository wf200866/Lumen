name: Build Lumen APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore keystore
        run: |
          if [ -f keystore.jks.b64 ]; then
            base64 -d keystore.jks.b64 > keystore.jks
            echo "✅ keystore 已还原"
          else
            echo "⚠️ 没有 keystore.jks.b64，生成临时签名"
            keytool -genkeypair -v -keystore keystore.jks \
              -alias lumen -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lumen2026 -keypass lumen2026 \
              -dname "CN=Lumen, OU=Dev, O=Lumen, L=NA, S=NA, C=CN"
          fi
          ls -lh keystore.jks

      - name: Check native libs
        run: |
          echo "=== jniLibs ==="
          ls -lh app/src/main/jniLibs/arm64-v8a/ || echo "(空)"
          echo "=== assets ==="
          ls -lh app/src/main/assets/ || echo "(空)"

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace --info

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$APK" | head -20 || true
          echo "=== 内含 so ==="
          unzip -l "$APK" | grep -E '\.so|assets/' | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore